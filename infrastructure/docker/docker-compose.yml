services:
  postgres:
    image: postgres:16
    container_name: clario-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: clario
      POSTGRES_USER: clario_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - clario_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clario_admin -d clario"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: clario-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - clario_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  clario_postgres:
  clario_redis:
