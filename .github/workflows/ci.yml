name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds the workspace dependency first: @clario/shared-contracts publishes
      # its types from dist/, which is gitignored and therefore missing on a fresh
      # checkout until it is built.
      - name: Build shared package
        run: pnpm --filter @clario/shared-contracts run build

      - name: Check TypeScript types
        run: pnpm -r --if-present run typecheck

      - name: Run ESLint
        run: pnpm --filter client run lint

      - name: Build backend
        run: pnpm --filter backend run build

      - name: Build Next.js application
        run: pnpm --filter client run build

      - name: Prepare test environment
        run: cp .env.example .env

      - name: Run Vitest
        run: pnpm --filter backend run test

      # API-level suite (Express routes + middleware). Dedicated
      # Testcontainers/real-service integration tests come later.
      - name: Run integration tests
        run: >
          pnpm --filter backend exec vitest run
          src/tests/app.test.ts
          src/tests/health.test.ts
          src/tests/middleware/request-context.test.ts
          src/tests/middleware/error-handler.test.ts
